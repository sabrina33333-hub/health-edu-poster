<!--
  16:9 螢幕/簡報骨架模板。強制單一畫面不捲動，內容密度中等（3-5 條重點）。
  如果主題需要完整分期表這種密集資訊，改用 a4-handout.html，不要硬塞進這個尺寸。
  同樣需要：CSS 變數從 palette.json 填值、插圖 base64 內嵌、icons.svg symbol 內聯。
-->
<title>{{PAGE_TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF7F2; --paper-raised:#FFFFFF;
    --ink:#3A2E28; --ink-soft:#7A6B60;
    --primary:#2E8C82; --primary-dark:#1D655D; --primary-soft:#D8F0EC;
    --accent-warm:#E08A5B;
    --line:#EADFD3;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1B1512; --paper-raised:#252019;
      --ink:#F3EAE1; --ink-soft:#C6B7A9;
      --primary:#6FCCC0; --primary-dark:#9DE0D6; --primary-soft:#213631;
      --accent-warm:#F0A56E;
      --line:#39312A;
    }
  }
  :root[data-theme="dark"]{
    --paper:#1B1512; --paper-raised:#252019;
    --ink:#F3EAE1; --ink-soft:#C6B7A9;
    --primary:#6FCCC0; --primary-dark:#9DE0D6; --primary-soft:#213631;
    --accent-warm:#F0A56E;
    --line:#39312A;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;display:flex;align-items:center;justify-content:center;}
  .frame{
    width:100%;max-width:960px;aspect-ratio:16/9;
    background:var(--paper-raised);border:1px solid var(--line);border-radius:20px;
    display:grid;grid-template-columns:1fr 1.15fr;overflow:hidden;
  }
  .art{background:var(--primary-soft);overflow:hidden;}
  .art img{width:100%;height:100%;object-fit:cover;display:block;}
  .body{padding:36px 40px;display:flex;flex-direction:column;justify-content:center;gap:14px;min-width:0;}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--primary-dark);text-transform:uppercase;}
  h1{margin:0;font-size:26px;font-weight:900;line-height:1.3;text-wrap:balance;}
  ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px;}
  li{position:relative;padding-left:18px;font-size:15px;font-weight:500;color:var(--ink-soft);line-height:1.55;}
  li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:var(--primary);}
  .foot{font-size:11px;color:var(--ink-soft);opacity:.75;margin-top:4px;}

  @media (max-width:640px){
    .frame{grid-template-columns:1fr;aspect-ratio:auto;}
    .art{aspect-ratio:16/9;}
  }
</style>

<div class="frame">
  <div class="art"><img src="{{IMG_BASE64}}" alt="{{IMG_ALT}}"></div>
  <div class="body">
    <span class="eyebrow">{{EYEBROW_TEXT}}</span>
    <h1>{{H1}}</h1>
    <ul>
      <li>{{POINT_1}}</li>
      <li>{{POINT_2}}</li>
      <li>{{POINT_3}}</li>
      <!-- 最多到 POINT_5 -->
    </ul>
    <p class="foot">{{FOOTER_DISCLAIMER_SHORT}}</p>
  </div>
</div>
