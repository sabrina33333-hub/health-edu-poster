<!--
  1:1 社群方圖骨架模板（LINE / IG / 群組分享用）。強制單一畫面不捲動，內容密度最低。
  套版前先決定「這張圖唯一要傳達的一句話」，其餘全部砍到最多 3-4 條精簡重點（每條不超過12字）。
  同樣需要：CSS 變數從 palette.json 填值、插圖 base64 內嵌、icons.svg symbol 內聯。
-->
<title>{{PAGE_TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF7F2; --paper-raised:#FFFFFF;
    --ink:#3A2E28; --ink-soft:#7A6B60;
    --primary:#2E8C82; --primary-dark:#1D655D; --primary-soft:#D8F0EC;
    --accent-warm:#E08A5B;
    --line:#EADFD3;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1B1512; --paper-raised:#252019;
      --ink:#F3EAE1; --ink-soft:#C6B7A9;
      --primary:#6FCCC0; --primary-dark:#9DE0D6; --primary-soft:#213631;
      --accent-warm:#F0A56E;
      --line:#39312A;
    }
  }
  :root[data-theme="dark"]{
    --paper:#1B1512; --paper-raised:#252019;
    --ink:#F3EAE1; --ink-soft:#C6B7A9;
    --primary:#6FCCC0; --primary-dark:#9DE0D6; --primary-soft:#213631;
    --accent-warm:#F0A56E;
    --line:#39312A;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;display:flex;align-items:center;justify-content:center;}
  .frame{
    width:100%;max-width:560px;aspect-ratio:1/1;
    background:var(--paper-raised);border:1px solid var(--line);border-radius:24px;
    display:flex;flex-direction:column;overflow:hidden;
  }
  .art{flex:1 1 auto;min-height:0;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;}
  .art img{width:100%;height:100%;object-fit:cover;display:block;}
  .body{flex:none;padding:22px 24px 20px;display:flex;flex-direction:column;gap:10px;}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--primary-dark);text-transform:uppercase;}
  h1{margin:0;font-size:22px;font-weight:900;line-height:1.35;text-wrap:balance;}
  ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;}
  li{position:relative;padding-left:16px;font-size:13.5px;font-weight:500;color:var(--ink-soft);line-height:1.5;}
  li::before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:50%;background:var(--primary);}
  .foot{font-size:10.5px;color:var(--ink-soft);opacity:.75;margin-top:2px;}
</style>

<div class="frame">
  <div class="art"><img src="{{IMG_BASE64}}" alt="{{IMG_ALT}}"></div>
  <div class="body">
    <span class="eyebrow">{{EYEBROW_TEXT}}</span>
    <h1>{{ONE_KEY_MESSAGE}}</h1>
    <ul>
      <li>{{POINT_1}}</li>
      <li>{{POINT_2}}</li>
      <li>{{POINT_3}}</li>
      <!-- 最多到 POINT_4，不要超過 -->
    </ul>
    <p class="foot">{{FOOTER_DISCLAIMER_SHORT}}</p>
  </div>
</div>
