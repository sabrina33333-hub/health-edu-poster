    <path d="M8.5 16c1-1.2 2.2-1.8 3.5-1.8s2.5.6 3.5 1.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  </symbol>

  <symbol id="icon-face-happy" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <circle cx="9" cy="10.5" r=".9" fill="currentColor" stroke="none"/>
    <circle cx="15" cy="10.5" r=".9" fill="currentColor" stroke="none"/>
    <path d="M8.5 14.3c1 1.2 2.2 1.8 3.5 1.8s2.5-.6 3.5-1.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
