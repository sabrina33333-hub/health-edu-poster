    <circle cx="9" cy="6" r="1.8" fill="var(--paper-raised,#fff)" stroke="currentColor" stroke-width="1.6"/>
    <line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="15" cy="12" r="1.8" fill="var(--paper-raised,#fff)" stroke="currentColor" stroke-width="1.6"/>
    <line x1="4" y1="18" x2="20" y2="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="11" cy="18" r="1.8" fill="var(--paper-raised,#fff)" stroke="currentColor" stroke-width="1.6"/>
