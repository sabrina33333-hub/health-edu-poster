    <circle cx="17.3" cy="6.3" r="1.3" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="19.6" cy="8.7" r="1.1" fill="none" stroke="currentColor" stroke-width="1.4"/>
