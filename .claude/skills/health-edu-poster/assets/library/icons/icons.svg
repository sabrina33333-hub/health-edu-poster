<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!--
    衛教產圖 skill 共用手繪線稿圖示庫。
    風格：24x24 viewBox，stroke=currentColor，stroke-width 1.8，圓角端點，無填色（除非特別標註 fill）。
    用法：<svg class="icon"><use href="icons.svg#icon-heart"/></svg>，外層用 CSS 控制 width/height/stroke color。
    無使用額度限制，需要新圖示可直接在這裡新增 <symbol>，同步更新 references/library-index.md。
  -->

  <!-- 器官類 -->
  <symbol id="icon-heart" viewBox="0 0 24 24">
    <path d="M12 20s-7-4.4-9.5-9C.8 7.3 3 4 6.3 4c2 0 3.3 1.1 4 2.2C11 5.1 12.3 4 14.3 4 17.6 4 19.8 7.3 18 11c-2.3 4.6-6 9-6 9Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M4 12h3l1.5-3 2 5 1.5-3H18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="icon-brain" viewBox="0 0 24 24">
    <path d="M8 4c-3 0-5 2.5-5 5.5S5 15 8 15h1l1 4h4l1-4h1c3 0 5-2.5 5-5.5S17 4 14 4c-1.2 0-2.2.4-3 1-.8-.6-1.8-1-3-1Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M9 8l2 2-1.5 2L12 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="icon-kidney" viewBox="0 0 24 24">
