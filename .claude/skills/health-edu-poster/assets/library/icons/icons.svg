  </symbol>

  <symbol id="icon-lung" viewBox="0 0 24 24">
    <path d="M12 3v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M12 9c-1-2-3-2.5-4.5-1.5C5.5 8.5 4 11 4 14c0 2.5 1 5 2.5 5 1.3 0 1.5-1.5 2-3 .5-1.5 1.5-2.5 3.5-2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12 9c1-2 3-2.5 4.5-1.5C18.5 8.5 20 11 20 14c0 2.5-1 5-2.5 5-1.3 0-1.5-1.5-2-3-.5-1.5-1.5-2.5-3.5-2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="icon-stomach" viewBox="0 0 24 24">
