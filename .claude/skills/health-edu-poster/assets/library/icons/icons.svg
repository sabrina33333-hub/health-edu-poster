  <symbol id="icon-family" viewBox="0 0 24 24">
    <circle cx="8" cy="7" r="2.3" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <path d="M4 18c0-2.8 1.8-4.5 4-4.5s4 1.7 4 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="17" cy="6" r="1.8" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <path d="M14.2 12c.4-.2.9-.3 1.4-.3 2 0 3.6 1.5 3.6 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
